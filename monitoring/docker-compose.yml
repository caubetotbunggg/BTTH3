version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_test_deploy
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_test_deploy
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
